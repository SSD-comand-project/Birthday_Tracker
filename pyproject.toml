[tool.poetry]
name = "company-birthday-tracker"
version = "0.1.0"
description = "MVP service for tracking employee birthdays"
authors = [
    "Sofia Palkina <s.palkina@innopolis.university>",
    "Amir Bairamov <a.bairamov@innopolis.university>",
    "Polina Kostikova <p.kostikova@innopolis.university>",
]
packages = [{include = "app"}]
package-mode = true

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
uvicorn = "^0.24.0"
streamlit = "^1.29.0"
sqlalchemy = "^2.0.0"
pyjwt = "^2.8.0"
pytest-asyncio = "^1.3.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-jose = "^3.3.0"
bcrypt = "3.2.2"
pydantic = "^2.9.2"
python-multipart = "^0.0.9"
requests = "^2.33.1"
prometheus-client = "^0.15.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = ">=5.0.0"
flake8 = "^6.1.0"
bandit = "^1.7.0"
radon = "^6.0.0"
pre-commit = "^3.5.0"
httpx = "^0.25.0"
locust = "^2.43.4"
pytest-asyncio = "^1.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = """
  --cov=app
  --cov-report=term-missing
  --cov-report=xml
"""
