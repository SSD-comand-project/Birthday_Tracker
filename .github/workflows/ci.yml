name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Lint with flake8
      run: poetry run flake8 app/

    - name: Security scan with bandit
      run: poetry run bandit -r app/ -ll

    - name: Check complexity with radon
      run: |
        poetry run radon cc -a -s -n B app/
        poetry run radon mi -s app/

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-security

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Create data directory
      run: mkdir -p data

    - name: Initialize test database
      run: poetry run python scripts/init_db.py
      env:
        DB_PATH: ${{ github.workspace }}/data/test.db

    - name: Run tests with coverage
      run: poetry run pytest tests --cov=app --cov-report=term-missing -v --cov-fail-under=20
      env:
         DB_PATH: ${{ github.workspace }}/data/test.db

  terraform-lint:
    name: Terraform Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: |
          cd infra
          terraform fmt -check

      - name: TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        run: |
          cd infra
          tflint

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra

  docker-build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [lint-and-security, unit-tests, terraform-lint]
    if: github.event_name == 'push' && github.ref_name == 'dev'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Initialize Buildx builder
        run: docker buildx create --use --name ci-builder

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Prepare image version tags
        run: |
          echo "IMAGE_VERSION=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build and push backend image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t mrdebuff/birthday-backend:latest \
            -t mrdebuff/birthday-backend:${IMAGE_VERSION} \
            -f ./app/backend/Dockerfile \
            --push .

      - name: Build and push frontend image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t mrdebuff/birthday-frontend:latest \
            -t mrdebuff/birthday-frontend:${IMAGE_VERSION} \
            -f ./app/frontend/Dockerfile \
            --push .
